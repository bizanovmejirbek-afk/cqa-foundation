<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criterion Studio · CQA</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="app">
<aside class="side" id="side" data-page="checklists"></aside>
<div class="main">
<header class="bar">
  <h1>Чек-листы · редактор критериев</h1>
  <label>Criterion
    <select id="criterion-picker"></select>
  </label>
  <button type="button" id="new-criterion">+ New criterion</button>
  <span id="version-badge" class="badge">v–</span>
</header>

<main class="studio">
  <!-- LEFT: the form. Every field carries name= so readForm() needs no per-field code. -->
  <form id="criterion-form" novalidate autocomplete="off">
    <fieldset>
      <legend>Basics</legend>
      <label>ID <input name="id" required pattern="[a-z][a-z0-9_]{1,63}" placeholder="c3_identification"></label>
      <label>Name <input name="name" required minlength="2"></label>
      <label>Definition <textarea name="definition" rows="4" required></textarea></label>
      <div class="row">
        <label>Type
          <select name="kind">
            <option value="binary">Yes / No</option>
            <option value="scale">Scale</option>
            <option value="violation">Violation (no points)</option>
          </select>
        </label>
        <label>Weight <input name="weight" type="number" min="0" step="0.5" value="10"></label>
        <label>Section <input name="section"></label>
        <label class="inline"><input name="enabled" type="checkbox" checked> Enabled</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Allowed verdicts</legend>
      <div id="options" class="rows"></div>
      <button type="button" data-action="add-option">+ Add option</button>
    </fieldset>

    <fieldset>
      <legend>N/A</legend>
      <label class="inline"><input name="na_allowed" type="checkbox"> N/A allowed</label>
      <label>N/A condition <textarea name="na_condition" rows="2" disabled></textarea></label>
    </fieldset>

    <fieldset>
      <legend>Sub-checks (optional; scale criteria: Gate rule only)</legend>
      <div class="row">
        <label>Rule
          <select name="sub_check_rule"><option value="all">All must pass</option><option value="any">Any passes</option><option value="gate">Gate: all pass → top verdict</option></select>
        </label>
        <label>Pass → <input name="pass_value" value="YES" size="6"></label>
        <label>Fail → <input name="fail_value" value="NO" size="6"></label>
      </div>
      <div id="subchecks" class="rows"></div>
      <button type="button" data-action="add-subcheck">+ Add sub-check</button>
    </fieldset>

    <fieldset>
      <legend>Channel notes</legend>
      <label>Chat <textarea name="note_chat" rows="2"></textarea></label>
      <label>Voice <textarea name="note_voice" rows="2"></textarea></label>
    </fieldset>

    <div class="actions">
      <input id="change-note" placeholder="Change note (shown in version history)">
      <button type="submit" id="save-btn">Save as new version</button>
    </div>
    <ul id="form-errors" class="errors" aria-live="polite"></ul>
  </form>

  <!-- RIGHT: live preview -->
  <section class="preview" aria-label="Live preview">
    <div class="preview-head">
      <h2>What the judge receives</h2>
      <span id="sync-status" class="badge">draft</span>
      <button type="button" data-copy="prompt-preview">Copy</button>
    </div>
    <pre id="prompt-preview" class="code"></pre>
    <div class="preview-head">
      <h2>Output schema</h2>
      <span id="schema-status" class="badge">draft</span>
    </div>
    <pre id="schema-preview" class="code"></pre>
  </section>
</main>

<!-- Row templates: cloned, never built from HTML strings (no XSS from user input) -->
<template id="option-row">
  <div class="opt-row">
    <input data-f="value" placeholder="YES / 20" size="6" required>
    <input data-f="points" type="number" min="0" step="0.5" placeholder="pts" size="4" required>
    <input data-f="definition" placeholder="Official meaning of this verdict" required>
    <button type="button" data-action="remove-row" aria-label="Remove">×</button>
  </div>
</template>
<template id="subcheck-row">
  <div class="sub-row">
    <input data-f="id" placeholder="greeted" size="12" pattern="[a-z][a-z0-9_]{1,63}" required>
    <input data-f="question" placeholder="Does the first operator message contain a greeting?" required>
    <select data-f="pass_answer" title="Answer that means no problem"><option value="YES">OK = YES</option><option value="NO">OK = NO</option></select>
    <select data-f="on_fail" title="What a problem means"><option value="fail">problem → lower</option><option value="na">problem → N/A</option></select>
    <button type="button" data-action="remove-row" aria-label="Remove">×</button>
  </div>
</template>

</div>
</div>
<script src="shell.js"></script>
<script src="studio.js" defer></script>
</body>
</html>
