<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Точность · CQA</title>
<link rel="stylesheet" href="app.css">
<style>
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:900px) { .two { grid-template-columns:1fr; } }
  .bar-cell { position:relative; min-width:160px; }
  .bar-fill { height:10px; border-radius:5px; background:var(--accent); }
  h2 { font-size:15px; margin:8px 0; }
  td, th { white-space:normal; }
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side" data-page="accuracy"></aside>
<div class="main">
<header class="page-head">
  <div><h1>Точность</h1><div class="sub">Сравнение вердиктов AI (до проверки человеком) с эталонной разметкой <code>eval/gold.json</code></div></div>
  <span class="spacer"></span>
  <a href="/api/accuracy/export.csv"><button type="button">Расхождения (CSV)</button></a>
  <button type="button" id="btn-refresh">Обновить</button>
</header>
<p id="notice" class="notice" aria-live="polite"></p>
<main>
  <div id="kpis" class="kpis"></div>
  <div class="two">
    <section><h2>По критериям</h2><table><thead><tr><th>Критерий</th><th>Точность</th><th></th><th>n</th></tr></thead><tbody id="crit"></tbody></table></section>
    <section><h2>По языкам</h2><table><thead><tr><th>Язык</th><th>Точность</th><th></th><th>n</th></tr></thead><tbody id="lang"></tbody></table></section>
  </div>
  <h2>Матрица ошибок (строки — эталон, столбцы — AI)</h2>
  <div id="confusion" class="two"></div>
  <h2>Расхождения (клик — открыть диалог)</h2>
  <table><thead><tr><th>Диалог</th><th>Критерий</th><th>Эталон</th><th>AI</th><th>Язык</th></tr></thead><tbody id="mis"></tbody></table>
</main>
</div>
</div>
<script src="shell.js"></script>
<script src="accuracy.js" defer></script>
</body>
</html>
