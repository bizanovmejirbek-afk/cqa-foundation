<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диалоги · CQA</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
<aside class="side" id="side" data-page="dialogs"></aside>
<div class="main">
  <header class="page-head">
    <div>
      <h1>Диалоги</h1>
      <div class="sub">Оценка чатов и звонков по официальному чек-листу из 8 критериев</div>
    </div>
    <span class="spacer"></span>
    <span id="llm-badge" class="badge">модель: …</span>
  </header>
  <p id="notice" class="notice" aria-live="polite"></p>
  <div id="kpis" class="kpis"></div>
  <div class="toolbar">
    <button type="button" id="btn-eval" class="primary" disabled>Оценить выбранные</button>
    <progress id="progress" hidden></progress>
    <span id="progress-text" class="small"></span>
    <span class="spacer"></span>
    <input id="filter" type="search" placeholder="Поиск по ID…" aria-label="Поиск по ID">
    <button type="button" id="btn-sync">Загрузить из API организаторов</button>
    <button type="button" id="btn-dev">Загрузить 65 dev-диалогов</button>
    <button type="button" id="btn-sample">Демо-диалоги</button>
  </div>
  <div class="wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p id="empty" class="small" hidden>Диалогов пока нет. Загрузите dev-диалоги или данные из API организаторов.</p>
</div>
</div>
<script src="shell.js"></script>
<script src="list.js" defer></script>
</body>
</html>
